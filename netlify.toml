# Statische site: geen build op Netlify, de gebouwde bestanden staan in site/.
[build]
  publish = "site"
  command = ""

# Beveiligingsheaders voor elke pagina. De site laadt alleen eigen bestanden en het lettertype van Google Fonts.
# Scripts staan inline in de pagina's, daarom 'unsafe-inline'; al het andere (andere domeinen, iframes, formulieren,
# plug-ins, gegevens versturen naar derden) is dichtgezet.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
